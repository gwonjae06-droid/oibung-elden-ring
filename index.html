<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>오이붕 엘든링 - 이권재전</title>
<style>
body{margin:0;overflow:hidden;font-family:sans-serif;color:#eee;background:#000}
.bar{position:fixed;left:16px;height:12px;border:1px solid #888;background:#222}
.bar i{display:block;height:100%}
#boss{left:20%;width:60%;bottom:24px;height:14px}
#msg{position:fixed;top:38%;width:100%;text-align:center;font-size:30px;white-space:pre-line}
#info{position:fixed;right:16px;top:12px;font-size:14px}
</style>
<div class="bar" style="top:16px;width:240px"><i id="hp" style="background:#c33;width:100%"></i></div>
<div class="bar" style="top:34px;width:200px"><i id="st" style="background:#3a5;width:100%"></i></div>
<div class="bar" id="boss"><i id="bh" style="background:#a22;width:100%"></i></div>
<div id="info"></div>
<div id="msg">무기를 고르세요\n1 검 · 2 망치 · 3 활 · 4 카드</div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x14131a);scene.fog=new THREE.Fog(0x14131a,20,70);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xaab0ff,0x222222,1.1));
const sun=new THREE.DirectionalLight(0xffe0b0,1.2);sun.position.set(10,20,5);scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,48),new THREE.MeshStandardMaterial({color:0x2b2a33}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const ARENA=38;

const WEAPONS={
 1:{name:'검',dmg:14,range:3.6,arc:1.6,cost:14,cd:.45},
 2:{name:'망치',dmg:30,range:3.8,arc:1.2,cost:30,cd:1.0},
 3:{name:'활',dmg:10,range:30,arc:.25,cost:12,cd:.7},
 4:{name:'카드',dmg:7,range:14,arc:.6,cost:7,cd:.25}};
let weapon=null;

const player=new THREE.Group();
const pbody=new THREE.Mesh(new THREE.CapsuleGeometry(.5,1,4,8),new THREE.MeshStandardMaterial({color:0x4a8fe0}));
pbody.position.y=1;player.add(pbody);
const pnose=new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.6),new THREE.MeshStandardMaterial({color:0xffffff}));
pnose.position.set(0,1.3,.5);player.add(pnose);
scene.add(player);player.position.set(0,0,12);

const boss=new THREE.Group();
const bmat=new THREE.MeshStandardMaterial({color:0x3a2a2a,emissive:0x000000});
const body=new THREE.Mesh(new THREE.SphereGeometry(2.2,24,16),bmat);body.position.y=2.4;body.scale.set(1,.8,1.3);boss.add(body);
const legs=[];
for(let i=0;i<8;i++){
 const l=new THREE.Mesh(new THREE.BoxGeometry(.25,.25,3.6),bmat);
 const side=i<4?-1:1,k=i%4;
 l.position.set(side*2.2,1.4,(k-1.5)*1.1);l.rotation.y=side*(.5+k*.18);l.rotation.z=side*.5;
 boss.add(l);legs.push(l);}
const jawL=new THREE.Group(),jawR=new THREE.Group();
const jm=new THREE.MeshStandardMaterial({color:0xcfc9b8,emissive:0x000000});
[[jawL,-.7],[jawR,.7]].forEach(([g,x])=>{
 const blade=new THREE.Mesh(new THREE.BoxGeometry(.28,.28,6),jm);blade.position.z=3;g.add(blade);
 g.position.set(x,2.6,2.6);boss.add(g);});
scene.add(boss);boss.position.set(0,0,-14);

const P={hp:100,st:100,flask:3,roll:0,inv:0,cd:0,dir:new THREE.Vector3(0,0,-1),dead:false};
const B={hp:600,max:600,st:'chase',t:0,pat:null,hit:0,dir:new THREE.Vector3(),dead:false,phase:1};
let yaw=0,pitch=.35;const keys={};let started=false;

const PAT={
 sweep:{w:.8,a:.25,r:.7,dmg:25},
 charge:{w:.9,a:.6,r:.9,dmg:35},
 slam:{w:1.0,a:.2,r:1.0,dmg:40},
 cross:{w:.7,a:.7,r:.8,dmg:20}};

function msg(t){$('msg').textContent=t}
function hurt(d){if(P.inv>0||P.dead)return;P.hp-=d;if(P.hp<=0){P.dead=true;msg('쓰러졌습니다\nR 키로 재도전')}}

addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(!started&&WEAPONS[e.key]){weapon=WEAPONS[e.key];started=true;msg('');}
 if(e.code==='KeyR'&&(P.dead||B.dead))location.reload();
 if(e.code==='Space'&&started&&!P.dead&&P.roll<=0&&P.st>=20){
  P.st-=20;P.roll=.4;P.inv=.3;
  const d=moveDir();if(d.lengthSq()>0)P.dir.copy(d);}
 if(e.code==='KeyF'&&P.flask>0&&!P.dead&&P.hp<100){P.flask--;P.hp=Math.min(100,P.hp+40)}
 e.preventDefault&&e.code==='Space'&&e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('click',()=>{if(document.pointerLockElement!==ren.domElement)ren.domElement.requestPointerLock()});
addEventListener('mousemove',e=>{if(document.pointerLockElement===ren.domElement){yaw-=e.movementX*.003;pitch=Math.max(.05,Math.min(1,pitch+e.movementY*.002))}});
addEventListener('mousedown',()=>{if(started&&document.pointerLockElement===ren.domElement)attack()});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

function moveDir(){
 const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const d=new THREE.Vector3();
 if(keys.KeyW)d.add(f);if(keys.KeyS)d.sub(f);if(keys.KeyD)d.add(r);if(keys.KeyA)d.sub(r);
 return d.normalize();}

function attack(){
 if(P.cd>0||P.dead||P.roll>0||P.st<weapon.cost)return;
 P.st-=weapon.cost;P.cd=weapon.cd;
 const to=boss.position.clone().sub(player.position);to.y=0;
 const dist=to.length();
 const aim=dist<weapon.range+3?to.clone().normalize():new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 P.dir.copy(aim);
 const ang=Math.acos(Math.max(-1,Math.min(1,aim.dot(to.clone().normalize()))));
 if(dist<weapon.range+2.5&&ang<weapon.arc&&!B.dead){
  B.hp-=weapon.dmg;
  if(B.hp<=0){B.dead=true;msg('이권재 격파\nR 키로 다시 시작')}}
 pbody.material.color.set(0xffee88);setTimeout(()=>pbody.material.color.set(0x4a8fe0),90);}

function bossPick(){
 const opts=['sweep','charge','slam'];if(B.phase===2)opts.push('cross');
 B.pat=opts[Math.floor(Math.random()*opts.length)];B.st='wind';B.t=0;B.hit=0;
 const to=player.position.clone().sub(boss.position);to.y=0;B.dir.copy(to.normalize());}

function bossUpdate(dt){
 if(B.dead){boss.rotation.z=Math.min(1.2,boss.rotation.z+dt);return}
 if(B.hp<B.max/2)B.phase=2;
 const to=player.position.clone().sub(boss.position);to.y=0;const dist=to.length();to.normalize();
 const p=PAT[B.pat]||{};
 B.t+=dt;
 jawL.rotation.x=jawR.rotation.x=0;jawL.rotation.y=jawR.rotation.y=0;
 jm.emissive.setHex(0);
 if(B.st==='chase'){
  boss.rotation.y=Math.atan2(to.x,to.z);
  if(dist>7)boss.position.addScaledVector(to,(B.phase===2?6:4.5)*dt);
  else if(B.t>.6)bossPick();
  if(B.t>3)bossPick();
 }else if(B.st==='wind'){
  const k=B.t/p.w;
  jawL.rotation.x=jawR.rotation.x=-k*.9;jm.emissive.setHex(0x661111);
  if(B.pat!=='charge')B.dir.copy(to);
  boss.rotation.y=Math.atan2(B.dir.x,B.dir.z);
  if(B.t>=p.w){B.st='act';B.t=0}
 }else if(B.st==='act'){
  jm.emissive.setHex(0xaa2222);
  const sw=Math.sin(B.t/p.a*Math.PI)*.9;
  if(B.pat==='sweep'||B.pat==='cross'){jawL.rotation.y=sw;jawR.rotation.y=-sw}
  if(B.pat==='slam'){jawL.rotation.x=jawR.rotation.x=sw*1.2}
  if(B.pat==='charge')boss.position.addScaledVector(B.dir,20*dt);
  const front=boss.position.clone().add(B.dir.clone().multiplyScalar(3));
  const pd=player.position.distanceTo(boss.position);
  const toP=player.position.clone().sub(boss.position);toP.y=0;
  const ang=Math.acos(Math.max(-1,Math.min(1,B.dir.dot(toP.clone().normalize()))));
  let hit=false;
  if(B.pat==='sweep'||B.pat==='cross')hit=pd<7&&ang<1.7;
  if(B.pat==='charge')hit=pd<3.8;
  if(B.pat==='slam')hit=pd<6.2;
  const times=B.pat==='cross'&&B.t>p.a/2?2:1;
  if(hit&&B.hit<times){B.hit++;hurt(p.dmg)}
  if(B.t>=p.a){B.st='rec';B.t=0}
 }else if(B.st==='rec'){
  if(B.t>=p.r){B.st='chase';B.t=0}}
 const r=Math.hypot(boss.position.x,boss.position.z);
 if(r>ARENA){boss.position.multiplyScalar(ARENA/r)}
 legs.forEach((l,i)=>l.rotation.x=Math.sin(performance.now()*.01+i)*.2*(B.st==='chase'?1:.2));}

let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(started&&!P.dead){
  P.cd-=dt;P.inv-=dt;
  P.st=Math.min(100,P.st+(P.roll>0?0:22)*dt);
  if(P.roll>0){P.roll-=dt;player.position.addScaledVector(P.dir,12*dt)}
  else{const d=moveDir();if(d.lengthSq()>0){player.position.addScaledVector(d,6*dt);P.dir.copy(d)}}
  const r=Math.hypot(player.position.x,player.position.z);
  if(r>ARENA)player.position.multiplyScalar(ARENA/r);
  player.rotation.y=Math.atan2(P.dir.x,P.dir.z);
  bossUpdate(dt);}
 const t=player.position;
 cam.position.set(t.x+Math.sin(yaw)*9*Math.cos(pitch),t.y+2+Math.sin(pitch)*9,t.z+Math.cos(yaw)*9*Math.cos(pitch));
 cam.lookAt(t.x,t.y+1.5,t.z);
 $('hp').style.width=Math.max(0,P.hp)+'%';$('st').style.width=P.st+'%';
 $('bh').style.width=Math.max(0,B.hp/B.max*100)+'%';
 $('info').textContent=(weapon?weapon.name:'-')+' · 회복약 '+P.flask;
 ren.render(scene,cam);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</html>
