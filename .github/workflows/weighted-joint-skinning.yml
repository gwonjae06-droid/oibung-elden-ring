name: Weighted joint skinning and rig validation

on:
  workflow_dispatch:
jobs:
  joint-skinning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Three.js
        run: npm install --no-save --no-audit --no-fund three@0.180.0
      - name: Check JavaScript modules
        run: |
          node --check src/joint-skinning.mjs
          node --check src/player-avatar.mjs
          node --check src/blood-leg-rig.mjs
          node --check src/blood-regalia.mjs
          node --check src/runtime/scene-resources.mjs
      - name: Validate skinning and existing IK/rig interfaces
        run: |
          node --test tests/joint-skinning.test.mjs tests/player-avatar.test.mjs tests/player-foot-ik.test.mjs tests/secondary-physics.test.mjs tests/blood-regalia.test.mjs tests/next-boss-rigging.test.mjs tests/blood-motion-followthrough.test.mjs
