name: Four boss autonomous footwork

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  footwork:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime dependency
        run: npm install --no-save --no-audit --no-fund three@0.180.0
      - name: Check movement modules
        run: |
          node --check src/boss-autonomy.mjs
          node --check src/combat.mjs
          node --check src/clown-combat.mjs
          node --check src/blood-footwork.mjs
          node --check src/blood-combat.mjs
          node --check src/blood-view.mjs
          node --check src/dice-autonomy.mjs
          node --check src/dice-combat.mjs
          node --check src/dice-giant.mjs
      - name: Real locomotion and regression across all bosses
        run: >
          node --test
          tests/four-boss-autonomous-locomotion.test.mjs
          tests/kwon-ranged-pressure.test.mjs
          tests/royal-pressure.test.mjs
          tests/clown.test.mjs
          tests/clown-engine.test.mjs
          tests/clown-patterns.test.mjs
          tests/blood-footwork-patterns.test.mjs
          tests/blood.test.mjs
          tests/dice-patterns.test.mjs
          tests/dice-giant-overhaul.test.mjs
          tests/dice-giant-continuity.test.mjs
          tests/boss-pattern-shuffle.test.mjs
