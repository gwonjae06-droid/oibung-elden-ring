name: Blood player movement parity

on:
  pull_request:
    paths:
      - 'src/player-movement-rules.mjs'
      - 'src/combat.mjs'
      - 'src/blood-combat.mjs'
      - 'src/blood-battle.mjs'
      - 'tests/blood-player-movement-parity.test.mjs'
      - 'tests/blood.test.mjs'
  push:
    branches: [main, fix/blood-player-movement-parity-20261106]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  movement:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependency
        run: npm install --no-save --no-audit --no-fund three@0.180.0
      - name: Check shared and boss-specific movement modules
        run: |
          node --check src/player-movement-rules.mjs
          node --check src/combat.mjs
          node --check src/blood-combat.mjs
          node --check src/blood-battle.mjs
      - name: Compare walking, dodging, debuffs, combat and boss mechanics
        run: node --test tests/blood-player-movement-parity.test.mjs tests/blood.test.mjs tests/combat.test.mjs tests/player-combat.test.mjs tests/dice-player.test.mjs tests/clown.test.mjs tests/blood-airborne-projectiles.test.mjs
