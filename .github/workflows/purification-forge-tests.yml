name: Purification flames focused tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Three.js test dependency
        run: npm install --no-save --no-audit --no-fund three@0.180.0 playwright-core@1.55.0
      - name: Purification economy and forge UI
        run: node --test tests/purification-forge.test.mjs
      - name: Journey state and legacy migration
        if: always()
        run: node --test tests/journey.test.mjs tests/boss-secret.test.mjs tests/chapter-environment.test.mjs tests/bootstrap.test.mjs
      - name: Full journey UI and unlocked boss travel controller
        if: always()
        run: node --test tests/journey-controller.test.mjs
      - name: Weapon evolution and blood progression compatibility
        if: always()
        run: node --test tests/weapon-evolution.test.mjs tests/blood.test.mjs
      - name: Browser forge purchase, refund and persistence smoke
        if: always()
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/forge-http.log 2>&1 &
          sleep 2
          node scripts/purification-forge-smoke.mjs
      - name: Unlocked boss travel, mobile stat chart and real blood battle
        if: always()
        run: node scripts/boss-travel-smoke.cjs
      - name: Production startup with stale journey cache
        if: always()
        run: node scripts/startup-cache-smoke.cjs
      - name: Archive purification forge screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purification-forge-screenshots
          path: |
            artifacts/purification-forge/
            artifacts/boss-travel/
          if-no-files-found: warn
          retention-days: 7
