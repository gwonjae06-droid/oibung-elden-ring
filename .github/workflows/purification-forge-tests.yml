name: Purification flames focused tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Three.js test dependency
        run: npm install --no-save --no-audit --no-fund three@0.180.0
      - name: Purification economy and forge UI
        run: node --test tests/purification-forge.test.mjs
      - name: Journey state and legacy migration
        if: always()
        run: node --test tests/journey.test.mjs tests/boss-secret.test.mjs tests/chapter-environment.test.mjs
      - name: Full journey UI and revival controller
        if: always()
        run: node --test tests/journey-controller.test.mjs
      - name: Weapon evolution and blood progression compatibility
        if: always()
        run: node --test tests/weapon-evolution.test.mjs tests/blood.test.mjs
