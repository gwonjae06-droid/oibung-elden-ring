name: Clown act-two legacy mini-boss and living troupe QA

on:
  push:
    branches: [main]
    paths:
      - 'src/clown-legacy-echo.mjs'
      - 'src/clown-legacy-echo-view.mjs'
      - 'src/clown-troupe.mjs'
      - 'src/clown-escape-routes.mjs'
      - 'src/clown-troupe-view.mjs'
      - 'src/clown-troupe-patterns.mjs'
      - 'src/clown-combat.mjs'
      - 'src/clown-phase2-score.mjs'
      - 'src/clown-phase2-performance.mjs'
      - 'src/clown-battle.mjs'
      - 'src/clown-ringmaster-actor.mjs'
      - 'src/clown-marionette-cross.mjs'
      - 'src/clown-actor.mjs'
      - 'tests/clown-act-two-revival.test.mjs'
      - 'tests/clown-marionette-reinforcements.test.mjs'
      - 'tests/clown-troupe-independent-cadence.test.mjs'
      - 'tests/clown-escape-routes.test.mjs'
      - 'tests/clown-uncanny-circus.test.mjs'
      - 'scripts/clown-marionette-browser-smoke.mjs'
      - '.github/workflows/clown-act2-revival.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revival:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Three dependency
        run: npm install --no-save --no-audit --no-fund three@0.180.0 playwright-core@1.55.0
      - name: Confirm live combat and cinematic syntax
        run: |
          for f in src/clown-legacy-echo.mjs src/clown-legacy-echo-view.mjs src/clown-troupe.mjs src/clown-troupe-view.mjs src/clown-troupe-patterns.mjs src/clown-combat.mjs src/clown-phase2-score.mjs src/clown-phase2-performance.mjs src/clown-battle.mjs src/clown-ringmaster-actor.mjs src/clown-marionette-cross.mjs src/clown-actor.mjs src/clown-escape-routes.mjs scripts/clown-marionette-browser-smoke.mjs tests/clown-marionette-reinforcements.test.mjs tests/clown-troupe-independent-cadence.test.mjs; do node --check "$f"; done
      - name: Test source mini boss, rolling hitbox, six ensemble performances, old combat and director identity
        run: >
          node --test
          tests/clown-act-two-revival.test.mjs
          tests/clown-marionette-reinforcements.test.mjs
          tests/clown-troupe-independent-cadence.test.mjs
          tests/clown-escape-routes.test.mjs
          tests/clown-troupe-melee.test.mjs
          tests/clown-ringmaster-autonomy.test.mjs
          tests/clown-ensemble-repertoire.test.mjs
          tests/clown-encore-escalation.test.mjs
          tests/clown-uncanny-circus.test.mjs
          tests/clown-circus-rebuild.test.mjs
          tests/clown-motion-realism.test.mjs
          tests/clown-patterns.test.mjs
      - name: Verify actual WebGL miniature models, X-shaped strings, projectiles and reinforcements
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/clown-marionette-http.log 2>&1 &
          sleep 2
          node scripts/clown-marionette-browser-smoke.mjs
      - name: Upload actual old-mini and marionette screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clown-marionette-webgl-screenshots
          path: artifacts/clown-marionette/
          if-no-files-found: warn
          retention-days: 7
