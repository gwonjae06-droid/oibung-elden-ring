name: Apply boss rules (one shot)
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-boss-rules.yml]
permissions:
  contents: write
  issues: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Three.js for 3D regression tests
        run: npm install --no-save --no-audit --no-fund three@0.180.0 playwright-core@1.55.0
      - name: Apply and verify patches group by group
        shell: bash
        run: python3 tools/apply_boss_rules.py 2>&1 | tee /tmp/apply.log
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -q tools || true
          git add -A src tests scripts docs README.md
          if git diff --cached --quiet; then
            echo 'nothing to commit'
          else
            git commit -m 'refactor: boss rules, dice and blood HUD cleanup, sound balance (verified group by group)'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Post report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch /tmp/report.md /tmp/apply.log
          if [ ! -s /tmp/report.md ]; then { echo 'No report was produced. Last log lines:'; echo '```'; tail -n 100 /tmp/apply.log; echo '```'; } > /tmp/report.md; fi
          gh issue create --title 'apply-boss-rules v2 report' --body-file /tmp/report.md
