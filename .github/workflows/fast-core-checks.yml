name: Fast core checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.html'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.html'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: fast-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runtime
        run: npm install --no-save --no-audit --no-fund three@0.180.0
      - name: Check critical gameplay module syntax
        run: |
          for f in src/combat.mjs src/arena.mjs src/kwon-lunar-sculpture.mjs src/kwon-moon-cataclysm-view.mjs src/kwon-moon-cataclysm.mjs src/arena-damage.mjs src/kwon-third-phase.mjs src/kwon-third-phase-view.mjs src/boss-stance.mjs src/clown-battle.mjs src/blood-battle.mjs src/gyuwon-battle.mjs; do
            node --check "$f"
          done
      - name: Verify Kwon counterattack windows and close-range pressure
        run: >
          node --test
          tests/kwon-punish-windows.test.mjs
          tests/kwon-close-engagement.test.mjs
          tests/kwon-ranged-pressure.test.mjs
          tests/kwon-close-defense-dodge-cancel.test.mjs
      - name: Verify giant lunar fragments, exact shadows and meteor timings
        run: node --test tests/kwon-moon-cataclysm.test.mjs
      - name: Verify Gyuwon annual exams, physical rigs and Suneung donation roulette
        run: >
          node --test
          tests/gyuwon-years.test.mjs
          tests/gyuwon-year-production.test.mjs
          tests/gyuwon-year-rework.test.mjs
          tests/gyuwon-no-triangle-vfx.test.mjs
          tests/gyuwon-apocalypse-upgrade.test.mjs
          tests/gyuwon-natural-years.test.mjs
      - name: Verify clown ballet scene and combat integration
        run: |
          node --check src/clown-ballet-score.mjs
          node --check src/clown-ballet-duet-view.mjs
          node --test tests/clown-ballet-duet.test.mjs tests/clown-ballet-duet-view.test.mjs tests/clown-engine.test.mjs tests/clown-nightmare-overhaul.test.mjs tests/clown-act-two-revival.test.mjs
      - name: Check startup, Kwon third phase and weapon skills
        run: node --test tests/arena-startup-guard.test.mjs tests/kwon-third-phase.test.mjs tests/weapon-skill-overhaul.test.mjs

