name: Fast core checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.html'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.html'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: fast-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runtime
        run: npm install --no-save --no-audit --no-fund three@0.180.0
      - name: Check critical gameplay module syntax
        run: |
          for f in src/combat.mjs src/arena.mjs src/arena-damage.mjs src/kwon-third-phase.mjs src/kwon-third-phase-view.mjs src/boss-stance.mjs src/clown-battle.mjs src/blood-battle.mjs src/gyuwon-battle.mjs; do
            node --check "$f"
          done
      - name: Check startup, Kwon third phase and weapon skills
        run: node --test tests/arena-startup-guard.test.mjs tests/kwon-third-phase.test.mjs tests/weapon-skill-overhaul.test.mjs
