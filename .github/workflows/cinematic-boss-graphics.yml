name: Cinematic PBR four-boss graphics regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Three.js and Chromium browser driver
        run: npm install --no-save --no-audit --no-fund three@0.180.0 playwright-core@1.55.0
      - name: Validate common physically-based materials and four battle integrations
        run: node --test tests/cinematic-graphics.test.mjs tests/boss-phase-environments.test.mjs tests/blood-cathedral-sea.test.mjs tests/clown-radiant-circus.test.mjs tests/casino-room.test.mjs
      - name: Render all four real boss scenes on desktop and landscape
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/cinematic-http.log 2>&1 &
          sleep 2
          node scripts/cinematic-realism-smoke.mjs
      - name: Archive actual cinematic battle screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-four-boss-graphics-screenshots
          path: artifacts/cinematic-realism/
          if-no-files-found: warn
          retention-days: 7
