name: Gyuwon 3-phase choreography regression
on:
  pull_request:
    paths:
      - 'src/gyuwon-combat.mjs'
      - 'src/gyuwon-motion.mjs'
      - 'src/gyuwon-view.mjs'
      - 'src/gyuwon-exam.mjs'
      - 'src/gyuwon-exam-view.mjs'
      - 'tests/gyuwon-exam.test.mjs'
      - 'tests/gyuwon-choreography.test.mjs'
      - '.github/workflows/gyuwon-three-phase-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  choreography:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Three.js test dependency
        run: npm install --no-save --no-package-lock --no-audit --no-fund three@0.180.0
      - name: Verify syntax of all changed logic
        run: |
          node --check src/gyuwon-combat.mjs
          node --check src/gyuwon-motion.mjs
          node --check src/gyuwon-view.mjs
          node --check src/gyuwon-exam.mjs
          node --check src/gyuwon-exam-view.mjs
          node --check tests/gyuwon-exam.test.mjs
          node --check tests/gyuwon-choreography.test.mjs
      - name: Verify three-phase patterns, motion, damage and memory framing
        run: |
          node --test \
            tests/gyuwon-exam.test.mjs \
            tests/gyuwon-choreography.test.mjs \
            tests/gyuwon.test.mjs \
            tests/gyuwon-pattern-exposure.test.mjs \
            tests/gyuwon-unified-combat-rig.test.mjs \
            tests/gyuwon-production-rules.test.mjs \
            tests/boss-animation-continuity.test.mjs \
            tests/gyuwon-recall.test.mjs
