name: Silent boss atmosphere visuals regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atmosphere:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Three.js and browser test dependency
        run: npm install --no-save --no-audit --no-fund three@0.180.0 playwright-core@1.55.0
      - name: Verify visual-only atmosphere, boss phase transitions and existing PBR / arena invariants
        run: node --test tests/boss-atmosphere.test.mjs tests/cinematic-graphics.test.mjs tests/boss-phase-environments.test.mjs tests/blood-cathedral-sea.test.mjs tests/clown-radiant-circus.test.mjs tests/casino-room.test.mjs
      - name: Render the four real battles on desktop and mobile landscape
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/atmosphere-http.log 2>&1 &
          sleep 2
          node scripts/cinematic-realism-smoke.mjs
      - name: Archive real boss render screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silent-boss-atmosphere-screenshots
          path: artifacts/cinematic-realism/
          if-no-files-found: warn
          retention-days: 7
