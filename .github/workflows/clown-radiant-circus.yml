name: Radiant clown circus visual regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Three.js and browser test dependency
        run: npm install --no-save --no-audit --no-fund three@0.180.0 playwright-core@1.55.0
      - name: Test luminous circus stage and original battle integration
        run: node --test tests/clown-radiant-circus.test.mjs tests/clown-engine.test.mjs tests/clown-stage-isolation.test.mjs tests/clown-pressure.test.mjs tests/clown-patterns.test.mjs
      - name: Launch Chromium WebGL render and capture 1P, 2P and mobile
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/circus-http.log 2>&1 &
          sleep 2
          node scripts/clown-radiant-circus-smoke.mjs
      - name: Archive actual circus screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiant-clown-circus-screenshots
          path: artifacts/clown-radiant-circus/
          if-no-files-found: warn
          retention-days: 7
