name: New boss signature pattern regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signatures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install combat rendering test dependencies
        run: npm install --no-save --no-audit --no-fund three@0.180.0 playwright-core@1.55.0
      - name: Test newly authored attacks and original phase/animation continuity
        run: |
          node --test tests/boss-signature-patterns.test.mjs tests/patterns.test.mjs tests/clown-patterns.test.mjs tests/dice-giant.test.mjs tests/blood-attack-animation.test.mjs tests/blood-footwork-patterns.test.mjs
