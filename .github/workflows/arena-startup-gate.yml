name: Actual arena startup WebGL gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install WebGL runtime test dependencies
        run: npm install --no-save --no-audit --no-fund three@0.180.0 playwright-core@1.55.0
      - name: Prevent boolean-call startup regression and stale HTML cache
        run: node --test tests/arena-startup-guard.test.mjs tests/cinematic-graphics.test.mjs
      - name: Start the actual game on desktop and touch landscape
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/arena-startup-http.log 2>&1 &
          sleep 2
          node scripts/arena-startup-smoke.mjs
      - name: Archive real WebGL startup screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-startup-desktop-mobile
          path: artifacts/arena-startup/
          if-no-files-found: warn
          retention-days: 7
