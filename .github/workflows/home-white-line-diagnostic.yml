name: Home white-line renderer diagnostic
on:
  pull_request:
    paths:
      - 'journey.css'
      - 'src/journey-art.mjs'
      - 'spider-combat.html'
      - 'scripts/home-white-line-diagnostic.mjs'
      - 'scripts/home-white-line-regression.mjs'
      - 'scripts/home-victory-crimson-smoke.mjs'
      - 'tests/home-mural-seams.test.mjs'
      - '.github/workflows/home-white-line-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and PNG inspection
        run: npm install --no-save --no-audit --no-fund three@0.180.0 playwright-core@1.55.0 pngjs@7.0.0
      - name: Check mural source and no duplicate layer rules
        run: node --test tests/home-mural-seams.test.mjs
      - name: Diagnose desktop and mobile home screen
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/home-ui-http.log 2>&1 &
          sleep 2
          node scripts/home-white-line-diagnostic.mjs
          node scripts/home-white-line-regression.mjs
          node scripts/home-victory-crimson-smoke.mjs
      - name: Keep home screens for comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odenring-home-mural
          path: artifacts/home-mural/
          retention-days: 7
          if-no-files-found: ignore
