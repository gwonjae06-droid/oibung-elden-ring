name: Gyuwon musical genre transitions
on:
  push:
    branches: [main]
    paths:
      - 'src/gyuwon-*.mjs'
      - 'tests/gyuwon-musical-genres.test.mjs'
      - 'tests/gyuwon-reference-games.test.mjs'
      - 'tests/gyuwon-dance-director.test.mjs'
      - 'tests/gyuwon-runner-handoff.test.mjs'
      - 'scripts/gyuwon-reference-qa.mjs'
      - 'scripts/gyuwon-giant-raid-qa.mjs'
      - 'scripts/gyuwon-reverie-qa.mjs'
      - 'scripts/gyuwon-act-five-ink-qa.mjs'
      - 'tests/gyuwon-act-five-score.test.mjs'
      - 'tests/gyuwon-act-five-acting.test.mjs'
      - 'tests/gyuwon-reverie.test.mjs'
      - 'tests/gyuwon-giant-raid.test.mjs'
      - 'tests/gyuwon-caption-sync.test.mjs'
      - 'scripts/gyuwon-musical-qa.mjs'
      - 'tests/gyuwon-opening-pacing.test.mjs'
      - 'scripts/gyuwon-musical-browser-smoke.mjs'
      - '.github/workflows/gyuwon-musical-acts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  musical-acts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Three test dependency
        run: npm install --no-save --no-package-lock --no-audit --no-fund three@0.180.0 playwright-core@1.55.0
      - name: Check stage, white world, combat, UI, music and tests
        run: |
          for f in src/gyuwon-dance-director.mjs src/gyuwon-2d-view.mjs src/gyuwon-reference-rules.mjs src/gyuwon-musical-genres.mjs src/gyuwon-musical-stage.mjs src/gyuwon-musical-hud.mjs src/gyuwon-musical-score.mjs src/gyuwon-musical-narrator.mjs src/gyuwon-years.mjs src/gyuwon-battle.mjs src/gyuwon-combat.mjs src/gyuwon-view.mjs src/gyuwon-ui.mjs src/gyuwon-year-rig.mjs src/gyuwon-year-world.mjs src/gyuwon-years-hud.mjs src/gyuwon-annual-progress.mjs tests/gyuwon-musical-genres.test.mjs tests/gyuwon-opening-pacing.test.mjs; do
            node --check "$f"
          done
      - name: Simulate all seven actual playable genres and final 800 HP
        run: node --test tests/gyuwon-act-five-score.test.mjs tests/gyuwon-act-five-acting.test.mjs tests/gyuwon-sculpted-actor.test.mjs tests/gyuwon-living-doodle.test.mjs tests/gyuwon-reverie.test.mjs tests/gyuwon-giant-raid.test.mjs tests/gyuwon-caption-sync.test.mjs tests/gyuwon-reference-games.test.mjs tests/gyuwon-dance-director.test.mjs tests/gyuwon-runner-handoff.test.mjs tests/gyuwon-musical-genres.test.mjs tests/gyuwon-song-clock.test.mjs tests/gyuwon-opening-pacing.test.mjs tests/gyuwon-curtain-call.test.mjs tests/journey-controller.test.mjs
      - run: npx playwright-core install --with-deps chromium
      - name: Native musical clocks, 3D party and five actual 2D genres
        run: |
          node scripts/gyuwon-musical-browser-smoke.mjs
      - name: Colored ink UI and synchronized original lyric scenes
        run: node scripts/gyuwon-act-five-ink-qa.mjs
      - name: Fourth-year reflection and uninterrupted imagination entry
        run: node scripts/gyuwon-reverie-qa.mjs
      - name: Full original 5su raid with native UI combat
        run: node scripts/gyuwon-giant-raid-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gyuwon-musical-acts-screenshots
          path: |
            qa-output/musical/
            qa-output/reference/
            qa-output/giant-raid/
            qa-output/reverie/
            qa-output/act-five-ink/
          if-no-files-found: warn
          retention-days: 7
