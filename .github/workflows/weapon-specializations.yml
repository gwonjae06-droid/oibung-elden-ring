name: Eight weapon forge specializations
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Three.js runtime for encounter integrations
        run: npm install --no-save --no-audit --no-fund three@0.180.0
      - name: Test all eight forge abilities across four boss fights
        run: node --test tests/weapon-specializations.test.mjs
