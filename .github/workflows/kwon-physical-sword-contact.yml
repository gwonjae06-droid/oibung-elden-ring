name: Kwon physical sword contact and close counters

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  physical-hit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install game dependency
        run: npm install --no-save --no-audit --no-fund three@0.180.0
      - name: Syntax checks
        run: |
          node --check src/combat.mjs
          node --check src/effects.mjs
          node --check src/effects-data.mjs
          node --check src/skill-fx.mjs
      - name: Sword hitbox and existing gameplay regressions
        run: >
          node --test
          tests/kwon-melee-contact-readability.test.mjs
          tests/close.test.mjs
          tests/combat.test.mjs
          tests/kwon-ranged-pressure.test.mjs
          tests/effects.test.mjs
          tests/boss-danger-presentation.test.mjs
          tests/attack-readability.test.mjs
