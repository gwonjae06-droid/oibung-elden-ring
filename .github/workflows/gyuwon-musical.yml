name: Gyuwon musical
on:
  pull_request:
    paths:
      - 'src/gyuwon-*.mjs'
      - 'src/journey*.mjs'
      - 'assets/music/gyuwon*'
      - 'tests/gyuwon-*.test.mjs'
      - 'tests/journey-controller.test.mjs'
      - 'scripts/gyuwon-musical-qa.mjs'
      - '.github/workflows/gyuwon-musical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  musical:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund three@0.180.0 playwright-core@1.55.0
      - run: node --test tests/gyuwon-musical-genres.test.mjs tests/gyuwon-song-clock.test.mjs tests/gyuwon-opening-pacing.test.mjs tests/journey-controller.test.mjs
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/gyuwon-musical-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gyuwon-musical-screenshots
          path: qa-output/musical/
          if-no-files-found: warn
