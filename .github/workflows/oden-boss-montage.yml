name: Oden Ring boss montage
on:
  push:
    branches: ['capture/boss-montage']
    paths: ['scripts/capture-oden.cjs', 'scripts/oden-montage/**', '.github/workflows/oden-boss-montage.yml']
concurrency:
  group: oden-boss-montage-cinematic-render-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        boss: [kwon, clown, dice, blood]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original renderer and local capture browser
        run: |
          npm install --no-save --no-audit --no-fund three@0.180.0 playwright@1.55.0
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "ODEN_CHROMIUM=$chrome" >> "$GITHUB_ENV"
          else
            timeout 110s npx playwright install chromium --only-shell
          fi
          if ! command -v ffmpeg >/dev/null; then
            timeout 100s python3 -m pip --disable-pip-version-check install --no-deps --only-binary=:all: --target "$RUNNER_TEMP/oden-ffmpeg" imageio-ffmpeg==0.8.1
            encoder="$(PYTHONPATH="$RUNNER_TEMP/oden-ffmpeg" python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            echo "ODEN_FFMPEG=$encoder" >> "$GITHUB_ENV"
          fi
          if ! fc-list :lang=ko | grep -q 'Noto Serif'; then
            mkdir -p "$HOME/.local/share/fonts"
            curl -fsSL --max-time 25 --retry 1 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Serif/OTF/Korean/NotoSerifCJKkr-SemiBold.otf -o "$HOME/.local/share/fonts/NotoSerifCJKkr-SemiBold.otf"
            fc-cache -f
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const capture = 'scripts/capture-oden.cjs';
          const stage = 'scripts/oden-montage/shoot.mjs';
          const server = 'scripts/oden-montage/montage-server.cjs';
          fs.writeFileSync(capture, fs.readFileSync(capture,'utf8')
            .replace('chromium.launch({headless:true','chromium.launch({executablePath:process.env.ODEN_CHROMIUM||undefined,headless:true')
            .replace('width:1152,height:648','width:960,height:540')
            .replace("'30','-vcodec'","'24','-vcodec'")
            .replaceAll('frames/30','frames/24')
            .replace("'-an','-c:v'","'-an','-vf','eq=brightness=0.021:contrast=1.035:saturation=1.055','-c:v'"));
          fs.writeFileSync(stage, fs.readFileSync(stage,'utf8')
            .replace('height=720, fps=30','height=720, fps=24')
            .replace("ctx.filter='contrast(1.035) saturate(1.055) brightness(1.065)';",""));
          fs.writeFileSync(server, fs.readFileSync(server,'utf8')
            .replace('const source=fs.readFileSync(file,\'utf8\').replace(/renderer','const source=fs.readFileSync(file,\'utf8\').replace(\'antialias:!coarse\',\'antialias:false\').replace(/renderer')
            .replace('if(!window.__shoot?.skipRender)renderer.render(scene,camera);',
              'if(!window.__shoot?.skipRender){if(window.__shoot?.manual){const s=window.__shoot;s.shadowFrame=(s.shadowFrame??-1)+1;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=s.shadowFrame%3===0;}renderer.render(scene,camera);}'));
          NODE
      - name: Render battle footage and mix original sound
        env:
          ODEN_ROOT: ${{ github.workspace }}
        run: node scripts/capture-oden.cjs ${{ matrix.boss }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-${{ matrix.boss }}
          path: |
            artifacts/oden-montage/${{ matrix.boss }}.mp4
            artifacts/oden-montage/${{ matrix.boss }}-*.jpg
            artifacts/oden-montage/${{ matrix.boss }}-*.json
          if-no-files-found: warn
          retention-days: 7
  assemble:
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: capture-*
          merge-multiple: true
          path: takes
      - name: Assemble and verify montage
        run: |
          encoder="$(command -v ffmpeg || true)"
          if [ -z "$encoder" ]; then
            timeout 100s python3 -m pip --disable-pip-version-check install --no-deps --only-binary=:all: --target "$RUNNER_TEMP/oden-ffmpeg" imageio-ffmpeg==0.8.1
            encoder="$(PYTHONPATH="$RUNNER_TEMP/oden-ffmpeg" python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          fi
          cd takes
          printf "file '%s.mp4'\n" kwon clown dice blood > inputs.txt
          "$encoder" -hide_banner -loglevel error -f concat -safe 1 -i inputs.txt -c copy -movflags +faststart ../Oden_Ring_Boss_Montage.mp4
          "$encoder" -hide_banner -v info -i ../Oden_Ring_Boss_Montage.mp4 -nostats -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: Oden_Ring_Boss_Montage
          path: Oden_Ring_Boss_Montage.mp4
          retention-days: 14