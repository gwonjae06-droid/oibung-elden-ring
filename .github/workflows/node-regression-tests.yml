name: Node regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Three.js for 3D lifecycle regression tests
        run: npm install --no-save --no-audit --no-fund three@0.180.0 playwright-core@1.55.0
      - name: Focused Blood boss sculpture and animation tests
        run: node --test tests/blood-attack-animation.test.mjs tests/blood-motion-followthrough.test.mjs tests/blood-regalia.test.mjs tests/blood-head.test.mjs tests/blood-render.test.mjs
      - name: Sacred cathedral geometry and battle-render regression tests
        run: node --test tests/blood-white-cathedral.test.mjs tests/blood-render.test.mjs tests/blood-cinematic.test.mjs
      - name: Run Node tests
        run: npm test
      - name: Smoke test browser boss battles
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/oibung-http.log 2>&1 &
          sleep 2
          status=0
          node scripts/dice-phase2-smoke.mjs || status=1
          node scripts/clown-shows-smoke.mjs || status=1
          exit "$status"
      - name: Save clown browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clown-show-screenshots
          path: artifacts/clown-shows/
          if-no-files-found: warn
          retention-days: 7
