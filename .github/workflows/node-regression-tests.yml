name: Node regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Three.js for 3D lifecycle regression tests
        run: npm install --no-save --no-audit --no-fund three@0.180.0
      - name: Run Node tests
        run: npm test
