name: Four boss full-body performance and cinematic light regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Three.js for presentation regression tests
        run: npm install --no-save --no-audit --no-fund three@0.180.0 playwright-core@1.55.0
      - name: Verify stage-synchronized whole-body poses and PBR light
        run: |
          node --test tests/boss-performance.test.mjs tests/boss-motion.test.mjs tests/boss-animation-polish.test.mjs tests/blood-motion-followthrough.test.mjs tests/cinematic-graphics.test.mjs
