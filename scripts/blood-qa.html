<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blood cinematic QA</title>
<style>body{margin:0;background:#100d16;color:#ead9ce;font:13px system-ui}nav{padding:8px;display:flex;flex-wrap:wrap;gap:5px}button,select{background:#31202c;color:#eee;border:1px solid #84515d;padding:7px}iframe{display:block;width:100%;height:calc(100vh - 180px);border:0}pre{margin:0;max-height:65px;overflow:auto;white-space:pre-wrap}#errors{color:#ff9a9a}</style>
<nav><button data-cmd="start">Start QA</button><button data-cmd="transition">Transform</button><button data-cmd="skip">Skip</button><button data-cmd="pause">Pause</button><button data-cmd="resume">Resume</button><button data-cmd="sequence">All 14 patterns</button><button data-cmd="repeat">Repeat pool test</button><button data-cmd="retry">Retry</button><button data-cmd="close">Close</button><select id="pattern"><option>wave</option><option>fountain</option><option>burst</option><option>orbs</option><option>chain</option><option>orbit</option><option>vortex</option><option>dive</option><option>eclipse</option><option>rain</option><option>wing</option><option>pulse</option><option>pursuit</option><option>tide</option></select><button data-cmd="pattern">Cast</button><button data-cmd="mute">Mute</button><button data-cmd="unmute">Unmute</button><button data-cmd="low">Low quality</button><button data-cmd="normal">Normal quality</button></nav>
<iframe title="Real blood battle" src="../spider-combat.html"></iframe><pre id="status">Loading real battle…</pre><pre id="errors"></pre>
<script type="module">
const frame=document.querySelector('iframe'),status=document.querySelector('#status'),errors=document.querySelector('#errors');
frame.onload=()=>{const script=frame.contentDocument.createElement('script');script.type='module';script.src=new URL('blood-qa-driver.mjs',location.href);frame.contentDocument.body.append(script);};
for(const b of document.querySelectorAll('[data-cmd]'))b.onclick=()=>frame.contentWindow.postMessage({bloodQa:b.dataset.cmd,pattern:document.querySelector('#pattern').value},location.origin);
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data.bloodQaStatus)status.textContent=JSON.stringify(e.data.bloodQaStatus);if(e.data.bloodQaError)errors.textContent+=e.data.bloodQaError+'\n';});
</script></html>
