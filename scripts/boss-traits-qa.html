<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss hit traits QA</title>
<style>body{margin:0;background:#15121a;color:#eee;font:13px system-ui}nav{display:flex;gap:6px;padding:6px;flex-wrap:wrap}button{padding:8px;background:#352432;border:1px solid #956c7b;color:#eee}iframe{width:100%;height:calc(100vh - 145px);border:0}pre{margin:0;max-height:90px;overflow:auto;white-space:pre-wrap}#errors{color:#ff9b9b}</style>
<nav><button data-cmd="kwon">Kwon</button><button data-cmd="clown">Clown</button><button data-cmd="dice">Dice</button><button data-cmd="blood">Blood</button><button data-cmd="hit">Hit player</button><button data-cmd="clear">Clear status</button><button data-cmd="close">Close</button></nav>
<iframe title="Real boss trait battle" src="../spider-combat.html"></iframe><pre id="status">Loading…</pre><pre id="errors"></pre>
<script type="module">
const frame=document.querySelector('iframe');frame.onload=()=>{const script=frame.contentDocument.createElement('script');script.type='module';script.src=new URL('boss-traits-qa-driver.mjs',location.href);frame.contentDocument.body.append(script);};
for(const b of document.querySelectorAll('[data-cmd]'))b.onclick=()=>frame.contentWindow.postMessage({traitQa:b.dataset.cmd},location.origin);
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data.traitStatus)document.querySelector('#status').textContent=JSON.stringify(e.data.traitStatus);if(e.data.traitError)document.querySelector('#errors').textContent+=e.data.traitError+'\n';});
</script></html>
