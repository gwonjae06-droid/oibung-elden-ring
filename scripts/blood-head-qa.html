<!doctype html><html><style>body{margin:0}nav{position:absolute}button{padding:12px}</style><nav><button id="front">Front</button><button id="side">Side</button><button id="back">Back</button></nav><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module">import * as T from 'three';import {buildBloodView} from '../src/blood-view.mjs';import {createBloodGame} from '../src/blood-combat.mjs';const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);const s=new T.Scene(),v=buildBloodView(s),g=createBloodGame();g.boss.x=g.boss.z=0;g.boss.yaw=0;v.update(g,0);s.add(new T.HemisphereLight(0xfff5e5,0x929b9b,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(2,8,5);s.add(light);const c=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,160);function pose(x,z){c.position.set(x,5.2,z);c.lookAt(0,4.4,0);}pose(0,5);document.querySelector('#front').onclick=()=>pose(0,5);document.querySelector('#side').onclick=()=>pose(3.6,3.6);document.querySelector('#back').onclick=()=>pose(3.6,-3.6);r.setAnimationLoop(()=>r.render(s,c));</script>
